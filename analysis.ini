[ImportObject]
ReshapeToCenter = 1

[RepairStl]
InputDir = examples/stl
OutputDir = data/stl/repaired_stl

[FilterStl]
OutputDir = data/stl/filtered_stl
# 简化后保留的目标三角面比例
Percent = 0.5
PercentDescription = 05

[Analysis]
InputDirRepair = data/obj_data/input_obj_data
InputDirFilter = data/obj_data/filter_obj_data
OutputDirResult = data/result
Workers = 1
Neighbors = 10
EquivalentDiameter = true
Wadell = true
PCA = true
ShapeVariance = true
Roughness = true
Fractal = false
FilterFractal = false

[Fractal]
# 分形计算的 STL 坐标、体素尺寸和膨胀半径均使用 mm
VoxelSize = 0.001
Radii = auto

[Display]
OutputDirRepair = picture/repair
OutputDirFilter = picture/filter
Shade = solid
Export = png

